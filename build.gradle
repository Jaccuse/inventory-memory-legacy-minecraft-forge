buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"

version = "1.3.0"
group = "com.slotmemory"
archivesBaseName = "slotmemory"

sourceCompatibility = targetCompatibility = "1.8"

ext.mcversion = "1.8.9"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"

    // Single source of truth for the mod version: SlotMemory.VERSION
    replace "@VERSION@", project.version
    replaceIn "SlotMemory.java"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.mcversion

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": project.mcversion
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}
